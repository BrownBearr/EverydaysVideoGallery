<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>everdays</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Crossfade length. main.ts reads this off the computed style, so the
         swap timing and the CSS transition can never drift apart. */
      --fade: 1100ms;
      /* How long the wall sits untouched before the chrome and cursor go away. */
      --idle: 4000ms;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    /* Two stacked layers; we crossfade between them on each swap so a clip
       never pops in mid-decode. Only the active layer is opaque. */
    .layer {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      transition: opacity var(--fade) ease-in-out;
    }

    .layer.active {
      opacity: 1;
    }

    .layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Foreground clip. Fills the screen by cropping when the clip's shape is
       within CROP_TOLERANCE of the display's; otherwise main.ts adds
       .fit-contain and the clip is shown whole with the bars filled below. */
    .layer .main {
      object-fit: cover;
    }

    .layer.fit-contain .main {
      object-fit: contain;
    }

    /* Ambient fill sits behind the main clip and only shows when the clip is
       letterboxed, blurred and enlarged to softly light the bars. The blur
       scales with the surface — a fixed radius reads as a recognisable second
       copy of the video once it's on a projector. */
    .layer .ambient {
      object-fit: cover;
      transform: scale(1.2);
      filter: blur(clamp(24px, 4vw, 90px)) brightness(0.55) saturate(1.2);
      opacity: 0;
      transition: opacity 900ms ease;
    }

    .layer.fit-contain .ambient {
      opacity: 1;
    }

    /* Corner falloff, painted over the ambient fill and under the clip itself.
       Projectors bloom at the edges; this keeps the bars from glowing without
       touching a single pixel of the video. Only present when there are bars. */
    .layer .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 900ms ease;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 40%,
        rgba(0, 0, 0, 0.28) 75%,
        rgba(0, 0, 0, 0.55) 100%
      );
    }

    .layer.fit-contain .vignette {
      opacity: 1;
    }

    #day {
      position: absolute;
      right: clamp(1rem, 3vw, 2.5rem);
      bottom: clamp(1rem, 3vw, 2.5rem);
      color: #fff;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(0.7rem, 1.6vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      text-transform: uppercase;
      text-shadow: 0 1px 24px rgba(0, 0, 0, 0.9);
      user-select: none;
      pointer-events: none;
      opacity: 0.4;
      transition: opacity 300ms ease;
    }

    /* Held at zero while the video crossfades, so the caption dissolves with
       the clip it names rather than snapping to the new number mid-swap. */
    #day.swap {
      opacity: 0;
    }

    /* Subtle bottom-left affordance to open the style picker. */
    #pickerToggle {
      position: absolute;
      left: clamp(1rem, 3vw, 2.5rem);
      bottom: clamp(1rem, 3vw, 2.5rem);
      appearance: none;
      background: none;
      border: none;
      color: #fff;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(0.7rem, 1.6vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-shadow: 0 1px 24px rgba(0, 0, 0, 0.9);
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 300ms ease;
    }

    #pickerToggle:hover {
      opacity: 0.85;
    }

    /* Gallery rest state. */
    body.idle {
      cursor: none;
    }

    body.idle #day,
    body.idle #pickerToggle {
      opacity: 0;
    }

    /* Full-screen catcher; the panel floats bottom-left. */
    #picker {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: clamp(1rem, 3vw, 2.5rem);
    }

    #picker.hidden {
      display: none;
    }

    .picker-inner {
      max-width: min(520px, 90vw);
      max-height: 70vh;
      overflow-y: auto;
      background: rgba(12, 12, 14, 0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 1rem 1.1rem 1.2rem;
    }

    .picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    #allBtn {
      appearance: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      font: inherit;
      letter-spacing: 0.2em;
      cursor: pointer;
    }

    #allBtn.on {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border-color: transparent;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .chip:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .chip.on {
      background: rgba(255, 255, 255, 0.92);
      color: #000;
      border-color: transparent;
    }

    .chip .n {
      font-variant-numeric: tabular-nums;
      font-size: 0.68rem;
      opacity: 0.55;
    }

    .chip.on .n {
      opacity: 0.6;
    }

    /* Shown only if the browser refuses to autoplay. One tap at gallery open
       satisfies the gesture requirement and it never returns. */
    #gate {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: rgba(255, 255, 255, 0.55);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(0.7rem, 1.6vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
    }

    #gate.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="layer" id="layerA">
      <video class="ambient" playsinline muted loop preload="auto"></video>
      <div class="vignette"></div>
      <video class="main" playsinline muted preload="auto"></video>
    </div>
    <div class="layer" id="layerB">
      <video class="ambient" playsinline muted loop preload="auto"></video>
      <div class="vignette"></div>
      <video class="main" playsinline muted preload="auto"></video>
    </div>
    <div id="day">day —</div>
    <button id="pickerToggle" type="button">filter</button>
    <div id="picker" class="hidden">
      <div class="picker-inner">
        <div class="picker-head">
          <span>styles</span>
          <button id="allBtn" type="button">all</button>
        </div>
        <div id="chips" class="chips"></div>
      </div>
    </div>
    <div id="gate" class="hidden">touch to begin</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
